name: MomentsAV
options:
  bundleIdPrefix: com.avalsys
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    PRODUCT_NAME: MomentsAV
    SWIFT_VERSION: "6.0"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

packages:
  AccountAV:
    path: ../../../account-av
  AppsAV:
    path: ../../../apps-av/apple
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.1

schemes:
  MomentsAV:
    build:
      targets:
        MomentsAV: all
    run:
      config: Debug
      executable: MomentsAV
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
    management:
      shared: true
    test:
      config: Debug
      targets:
        - MomentsAVTests

targets:
  MomentsAV:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: MomentsAV
    dependencies:
      - package: AccountAV
        product: AccountAV
      - package: AppsAV
        product: AVBrandFoundation
      - package: AppsAV
        product: AVAppShellFoundation
      - package: AppsAV
        product: AVLaunchFoundation
      - package: AppsAV
        product: AVSettingsFoundation
      - package: AppsAV
        product: AVAviFoundation
      - package: ConvexMobile
        product: ConvexMobile
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: MomentsAV/App/MomentsAV.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(AVALSYS_APPLE_DEVELOPMENT_TEAM)"
        ENABLE_DEBUG_DYLIB: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MomentsAV/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandAccent
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  MomentsAVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MomentsAVTests
    dependencies:
      - target: MomentsAV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: MomentsAVTests
        PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER).tests"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MomentsAV.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MomentsAV"
